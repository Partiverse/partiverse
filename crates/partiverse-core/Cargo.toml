# Partiverse 领域核心(统一索引/配额预算/传输编排的公共底座)。
[package]
name = "partiverse-core"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0"
# 应用内部 crate,不发布到 registry(deny.toml [licenses] private 豁免依赖此标记)。
publish = false

[dependencies]
# job 落库(M1-WP03-T02,ADR-0006):bundled 免系统库耦合;default-features=false
# 裁 cache 与 ffi-sqlite-wasm-rs(后者 wasm 链触发 deny multiple-versions)。
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
# rc 载荷参数面(ADR-0006;与 engine 同版本单源)。
serde_json = "1.0.151"
# OS keychain(M1-WP04-T01,ADR-0007):keyring 2.3.3 单 API 覆盖三平台后端——
# linux=内核 keyring(linux-default-keyutils,纯 Rust 零系统包/零 D-Bus 守护进程
# 依赖,headless 可用);windows=Credential Manager(windows-sys ^0.52,与树内
# ring 同版本,零新增版本);macos=Security Framework(security-framework ^2.6)。
# default-features=false 收敛依赖面(默认 platform-all 会把 secret-service 系
# 后端拉进 union 图)。候选池 3.x/4.x 线后端(zbus 纯 Rust 树/windows-sys 0.61/
# v1 全平台默认集)均实测触发本仓 deny multiple-versions,逐项证据见 ADR-0007。
keyring = { version = "2.3.3", default-features = false, features = [
    "platform-windows",
    "platform-macos",
    "linux-default-keyutils",
] }

# token 端点 HTTP 客户端(M1-WP04-T02,树内既有依赖单源,ADR-0004):与
# partiverse-engine 同版 3.4.2(union 零新增版本),默认 rustls+ring;本 crate
# 代码路径不触及 TLS 配置,证书校验恒开(ureq 3.4.2 提供 disable_verification
# 开关,本仓零调用,审查实证);生产请求面仅百度 token 端点(https),
# 本地回环 http 为测试 Fake 注入缝(卡内 ⑥ 禁真实网络)。
ureq = "3.4.2"

# 主密钥随机源的非 unix 平台分支(M1-WP04-T01,ADR-0007):windows/mac 无
# /dev/urandom,std 直读不可移植;getrandom 0.2 = 树内既有版本(ring 传递依赖,
# 零新增版本,deny multiple-versions 保持绿),内部走 BCryptGenRandom/getentropy
# 等平台 CSPRNG(其自身 unsafe 面属上游审计范围,与 ADR-0005 nix 同口径)。
# unix 路径仍按 ADR-0005 先例 std 读 /dev/urandom,不经本依赖。
[target.'cfg(not(unix))'.dependencies]
getrandom = "0.2.17"

[dev-dependencies]
# T01 RcClient 接缝仅测试消费(Cargo 禁止普通依赖成环:partiverse-engine 已依赖
# 本 crate);生产消费面 = jobs::RcDispatch trait,由引擎/应用层适配(ADR-0006);
# 显式 version 避免 deny wildcards=deny 误伤(ADR-0004 同款)。
partiverse-engine = { path = "../partiverse-engine", version = "0.1.0" }
# 零依赖基线(M1);新依赖需 ADR(AGENTS.md 铁律 8)。
