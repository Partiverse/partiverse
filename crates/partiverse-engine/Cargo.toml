# partiverse-engine:rclone rcd 引擎协调器(T01=引擎分发器;T02/T03 落地 rcd spawn 与槽位编排)。
# 依赖集与 license 审计见 docs/adr/0004*.md(AGENTS.md 铁律 8:新依赖需 ADR)。
[package]
name = "partiverse-engine"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0"
# 应用内部 crate,不发布到 registry(deny.toml [licenses] private 豁免依赖此标记)。
publish = false

[dependencies]
# Severity 错误分级底座(同 workspace 内部依赖;显式 version 避免 deny wildcards=deny 误伤)。
partiverse-core = { path = "../partiverse-core", version = "0.1.0" }
hex = "0.4.3" # 摘要 hex 编解码(manifest 校验值与实测值比对)
serde = { version = "1.0.229", features = ["derive"] } # manifest 反序列化
serde_json = "1.0.151"
sha2 = "0.11.0" # zip/落盘二进制 sha256 完整性校验(RustCrypto)
# 多源下载同步 HTTP 客户端(默认 rustls+ring,证书校验不可关;阻塞调用由调用方放 spawn_blocking)。
ureq = "3.4.2"
# zip 解包仅读取:deflate 后端取 zlib-rs(纯 Rust),关 aes/zstd/bzip2/zopfli 等无关特性收敛依赖树。
zip = { version = "9.0.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# SIGTERM 优雅退出(T02):std 仅有 SIGKILL,libc 直调需 unsafe(workspace 禁);
# nix 安全封装,default-features=false 仅 signal 特性收敛依赖树(ADR-0005)。
nix = { version = "0.31.3", default-features = false, features = ["signal"] }
# 注:安装根解析不引 dirs(与 ring 的 windows-sys 版本冲突触发 deny multiple-versions,见 ADR-0004)。
