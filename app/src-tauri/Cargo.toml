[package]
name = "app"
version = "0.1.0"
description = "Partiverse desktop shell (Tauri 2 app skeleton, M1-WP01-T02)"
authors = ["Partiverse AI Builder"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["specta"] }
serde = { version = "1", features = ["derive"] }
# tauri-specta rc.25 精确钉版要求 specta =2.0.0-rc.25(见其 crates.io 元数据)。
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
# Typescript 导出配置按名导入;0.0.x 版本与 tauri-specta 的 ^0.0.12 要求重合。
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript"] }

# 仅测试用:断言 CmdError 的 {kind,msg} IPC 线格式。
[dev-dependencies]
serde_json = "1"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# 独立于仓库根工作区(M1-WP01-T01 产物不改动):app 壳自成 workspace。
[workspace]
